primary_region = "lhr"

[http_service]
auto_start_machines = true
auto_stop_machines = false
force_https = true
internal_port = 5001
min_machines_running = 1
processes = ["app"]

[[http_service.checks]]
interval = "15s"
timeout = "10s"
grace_period = "60s"
method = "GET"
path = "/api/health"

[[vm]]
memory = "512mb"
cpu_kind = "shared"
cpus = 1

[[services]]
protocol = "tcp"
internal_port = 1587
auto_stop_machines = false
auto_start_machines = true
min_machines_running = 1
processes = ["app"]

  [[services.ports]]
  port = 465
  handlers = ["tls"]

[[services]]
protocol = "tcp"
internal_port = 1993
auto_stop_machines = false
auto_start_machines = true
min_machines_running = 1
processes = ["app"]

  [[services.ports]]
  port = 993
  handlers = ["tls"]
