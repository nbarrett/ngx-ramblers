<app-page autoTitle>
  @if (member) {
    <div class="row thumbnail-heading-frame">
      <div class="thumbnail-heading">Login details</div>
      <div class="col-12">
        <div class="row align-items-start">
          <div class="col-sm-3 text-center">
            <fa-icon [icon]="faUnlockAlt" class="fa-5x admin-icon"></fa-icon>
            <h6 class="mt-2">And optionally change login user name</h6>
          </div>
          <div class="col-sm-9">
            <div class="form-group">
              <label for="prof-login-user-name">Login User Name</label>
              <input [(ngModel)]="enteredMemberCredentials.userName" type="text" class="form-control input-sm"
                     autocomplete="username"
                     name="userName"
                     id="prof-login-user-name"
                     placeholder="Enter login user name here">
            </div>
            <div class="form-group">
              <label for="prof-new-password">New Password</label>
              <app-secret-input
                [(ngModel)]="enteredMemberCredentials.newPassword"
                id="prof-new-password"
                name="new-password"
                [size]="InputSize.SM"
                placeholder="Enter new password">
              </app-secret-input>
            </div>
            <div class="form-group">
              <label for="prof-new-password-confirm">Confirm New Password</label>
              <app-secret-input
                [(ngModel)]="enteredMemberCredentials.newPasswordConfirm"
                id="prof-new-password-confirm"
                name="newPassword"
                [size]="InputSize.SM"
                placeholder="Confirm new password">
              </app-secret-input>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="mt-3">
      <app-form-save-actions
        [disabled]="!member || notifyTarget.busy"
        [actions]="formSaveActions"
        saveLabel="Save"/>
    </div>
  }
  @if (notifyTarget.showAlert) {
    <div class="alert {{notifyTarget.alertClass}} mt-3">
      <fa-icon [icon]="notifyTarget.alert.icon"></fa-icon>
      @if (notifyTarget.alertTitle) {
        <strong>
          {{ notifyTarget.alertTitle }}: </strong>
      } {{ notifyTarget.alertMessage }}
      @if (notifyTarget.showContactUs) {
        <span> contact our <app-contact-us class="alert-link"></app-contact-us>.
        </span>
      }
    </div>
  }
</app-page>
