@for (page of pages(); track page) {
  <li class="navigation">
    <a (click)="unToggleMenu()" [ngClass]="{'active' : isOnPage(page)} "
       [attr.aria-current]="isOnPage(page) ? 'page' : null"
       [routerLink]="'/' + page.href"
       [queryParams]="{}"
       title="{{page.title}}"><span class="navigation-label" [textContent]="page.title"></span></a>
  </li>
}

@if (showMobileInbox()) {
  <li class="navigation d-lg-none">
    <a (click)="unToggleMenu()" [ngClass]="{'active' : isOnPage(inboxLink)}"
       [attr.aria-current]="isOnPage(inboxLink) ? 'page' : null"
       [routerLink]="'/' + inboxLink.href"
       [queryParams]="{}"
       title="{{inboxLink.title}}">
      <fa-icon [icon]="faInbox" class="me-2"/><span class="navigation-label">{{inboxLink.title}}</span>
    </a>
  </li>
}

@if (mobileAppAccess.allowed(MobileAppAction.ACCESS)) {
  <li class="navigation d-lg-none">
    <a (click)="unToggleMenu()" [routerLink]="['/', AppPath.ROOT]" [queryParams]="{}">
      <fa-icon [icon]="faPersonHiking" class="me-2"/> Walking app
    </a>
  </li>
  <li class="navigation d-lg-none">
    <a (click)="unToggleMenu()" [routerLink]="['/', AppPath.ROOT]" [queryParams]="appSettingsQuery">
      <fa-icon [icon]="faSliders" class="me-2"/> App settings
    </a>
  </li>
}
