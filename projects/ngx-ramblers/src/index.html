  <script>
    (function () {
      try {
        var installed = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
        var lastAppUrl = localStorage.getItem("app-last-url");
        if (installed && (location.pathname === "/" || location.pathname === "/app")) {
          var restoredUrl = lastAppUrl && /^\/app(?:\/|\?|$)/.test(lastAppUrl) ? lastAppUrl : "/app";
          history.replaceState(null, "", restoredUrl);
        }
      } catch (error) {
        document.documentElement.dataset.appRestoreError = "true";
      }
      var walkingApp = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true || location.pathname === "/app" || location.pathname.indexOf("/app/") === 0;
      if (!walkingApp) {
        try {
          var xhr = new XMLHttpRequest();
          xhr.open("GET", "/api/database/config?key=system", false);
          xhr.send(null);
          if (xhr.status >= 200 && xhr.status < 300) {
            var payload = JSON.parse(xhr.responseText);
            var doc = payload.response || payload;
            var group = (doc && (doc.group || (doc.value && doc.value.group))) || {};
            var name = group.shortName || group.longName;
            if (name) {
              var title = document.querySelector("meta[name=\"apple-mobile-web-app-title\"]");
              var appName = document.querySelector("meta[name=\"application-name\"]");
              if (title) {
                title.setAttribute("content", name);
              }
              if (appName) {
                appName.setAttribute("content", name);
              }
            }
          }
        } catch (error) {
        }
      }
    })();
  </script>
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

    .app-startup img { width: 88px; height: 88px; border-radius: 16px; }
    .app-startup h1 { margin: 0; font: 700 28px system-ui, sans-serif; color: inherit; }
    .app-startup p { margin: 0; }
    .app-startup-spinner { width: 28px; height: 28px; border: 3px solid #d0d4d2; border-top-color: #f9b104; border-radius: 50%; animation: app-startup-turn 1s linear infinite; }
    @keyframes app-startup-turn { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .app-startup-spinner { animation: none; } }
    @media (prefers-color-scheme: dark) { .app-startup { background: #102018; color: #f4f1ea; } }

<script>
  (function () {
    var host = location.hostname;
    var local = host === "localhost" || host === "127.0.0.1";

    function clearChunkReloadKeys() {
      Object.keys(sessionStorage).forEach(function (key) {
        if (key.indexOf("chunk-reload-") === 0) {
          sessionStorage.removeItem(key);
        }
      });
    }

    function dropWorkersAndCaches() {
      if (!("serviceWorker" in navigator)) {
        return Promise.resolve(false);
      }
      return navigator.serviceWorker.getRegistrations().then(function (registrations) {
        if (!registrations.length) {
          return false;
        }
        return Promise.all(registrations.map(function (registration) {
          return registration.unregister();
        })).then(function () {
          if (!window.caches) {
            return true;
          }
          return caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (key) {
              return caches.delete(key);
            }));
          }).then(function () {
            return true;
          });
        });
      });
    }

    var params = new URLSearchParams(location.search);
    if (params.get("_chunkfix")) {
      params.delete("_chunkfix");
      var cleaned = params.toString();
      history.replaceState(null, "", location.pathname + (cleaned ? "?" + cleaned : "") + location.hash);
    }

    var installed = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
    if (local && !installed && location.pathname !== "/app" && location.pathname.indexOf("/app/") !== 0) {
      dropWorkersAndCaches().then(function (hadWorker) {
        if (hadWorker) {
          clearChunkReloadKeys();
          location.reload();
        }
      });
    }

    window.addEventListener("unhandledrejection", function (event) {
      var reason = event && event.reason;
      var text = String((reason && reason.message) || reason || "");
      var walkingApp = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true || location.pathname === "/app" || location.pathname.indexOf("/app/") === 0;
      if (!walkingApp && text.indexOf("Failed to fetch dynamically imported module") !== -1) {
        dropWorkersAndCaches().then(function () {
          clearChunkReloadKeys();
          var next = new URLSearchParams(location.search);
          if (!next.get("_chunkfix")) {
            next.set("_chunkfix", "1");
            var query = next.toString();
            location.replace(location.pathname + (query ? "?" + query : "") + location.hash);
          }
        });
      }
    });
  })();
</script>
