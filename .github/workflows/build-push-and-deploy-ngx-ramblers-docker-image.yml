name: Deploy and Build Docker Image and Deploy to Fly.io

on:
  push:
    branches: [ "main", "pre-main" ]
  pull_request:
    branches: [ "main" ]

env:
  NODE_VERSION: '24.14.0'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      chrome_version: ${{ steps.vars.outputs.chrome_version }}
      auto_deploy_target: ${{ steps.vars.outputs.auto_deploy_target }}
      auto_deploy_app_name: ${{ steps.vars.outputs.auto_deploy_app_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache root node_modules
        id: cache-root-nm
        uses: actions/cache@v5
        with:
          path: node_modules
          key: root-nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install root dependencies
        if: steps.cache-root-nm.outputs.cache-hit != 'true'
        run: npm ci --fetch-retries=5 --fetch-retry-factor=2 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000

      - name: Cache server node_modules
        id: cache-server-nm
        uses: actions/cache@v5
        with:
          path: server/node_modules
          key: server-nm-${{ runner.os }}-${{ hashFiles('server/package-lock.json') }}

      - name: Install server dependencies
        if: steps.cache-server-nm.outputs.cache-hit != 'true'
        run: npm ci --fetch-retries=5 --fetch-retry-factor=2 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000
        working-directory: ./server

      - name: Resolve build-time variables from database
        id: vars
        env:
          ADMIN_MONGODB_URI: ${{ secrets.ADMIN_MONGODB_URI }}
          ENVIRONMENTS_ENCRYPTION_KEY: ${{ secrets.ENVIRONMENTS_ENCRYPTION_KEY }}
        run: ./server/node_modules/.bin/tsx server/deploy/resolve-build-time-vars.ts

  test:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache root node_modules
        id: cache-root-nm
        uses: actions/cache@v5
        with:
          path: node_modules
          key: root-nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install root dependencies
        if: steps.cache-root-nm.outputs.cache-hit != 'true'
        run: npm ci --fetch-retries=5 --fetch-retry-factor=2 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000

      - name: Cache server node_modules
        id: cache-server-nm
        uses: actions/cache@v5
        with:
          path: server/node_modules
          key: server-nm-${{ runner.os }}-${{ hashFiles('server/package-lock.json') }}

      - name: Install server dependencies
        if: steps.cache-server-nm.outputs.cache-hit != 'true'
        run: npm ci --fetch-retries=5 --fetch-retry-factor=2 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000
        working-directory: ./server

      - name: Run lint checks (frontend + server)
        run: npm run lint:all

      - name: Typecheck server
        run: npm run typecheck:server

      - name: Setup Chrome for headless tests
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: ${{ needs.resolve.outputs.chrome_version }}

      - name: Export CHROME_BIN for Karma
        run: echo "CHROME_BIN=$CHROME_PATH" >> $GITHUB_ENV

      - name: Set timezone for tests
        run: echo "TZ=Europe/London" >> $GITHUB_ENV

      - name: Run frontend unit tests (headless)
        run: npm run test

      - name: Run server unit tests
        run: npm run test:server

      - name: Verify Serenity scenario discovery (worker load path)
        run: npm run test:serenity-discovery --prefix server

  deploy:
    needs: [resolve, test]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-group
      cancel-in-progress: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache root node_modules
        id: cache-root-nm
        uses: actions/cache@v5
        with:
          path: node_modules
          key: root-nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install root dependencies
        if: steps.cache-root-nm.outputs.cache-hit != 'true'
        run: npm ci --fetch-retries=5 --fetch-retry-factor=2 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000

      - name: Cache server node_modules
        id: cache-server-nm
        uses: actions/cache@v5
        with:
          path: server/node_modules
          key: server-nm-${{ runner.os }}-${{ hashFiles('server/package-lock.json') }}

      - name: Install server dependencies
        if: steps.cache-server-nm.outputs.cache-hit != 'true'
        run: npm ci --fetch-retries=5 --fetch-retry-factor=2 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000
        working-directory: ./server

      - name: Detect worker-relevant changes
        id: worker-changes
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
        run: ./server/node_modules/.bin/tsx server/deploy/detect-worker-changes.ts

      - name: Install ts-node
        run: npm install -g ts-node

      - name: Log in to Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: echo "$DOCKER_PASSWORD" | docker login --username "$DOCKER_USERNAME" --password-stdin

      - name: Describe the commit being built
        id: build-info
        run: |
          echo "commit_message=$(git log -1 --pretty=%s)" >> "$GITHUB_OUTPUT"
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build the Docker image
        env:
          BUILD_COMMIT_MESSAGE: ${{ steps.build-info.outputs.commit_message }}
        run: >
          docker build .
          --build-arg BUILD_NUMBER=${{ github.run_number }}
          --build-arg BUILD_COMMIT_SHA=${{ github.sha }}
          --build-arg "BUILD_COMMIT_MESSAGE=$BUILD_COMMIT_MESSAGE"
          --build-arg BUILD_BRANCH=${{ github.ref_name }}
          --build-arg BUILD_TIMESTAMP=${{ steps.build-info.outputs.timestamp }}
          --build-arg BUILD_URL=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          --build-arg BUILD_IMAGE_TAG=${{ secrets.DOCKER_USERNAME }}/ngx-ramblers:${{ github.run_number }}
          --file Dockerfile --target website --tag ngx-ramblers:${{ github.run_number }}

      - name: Tag the Docker image (latest)
        if: github.ref_name == 'main'
        run: docker tag ngx-ramblers:${{ github.run_number }} ${{ secrets.DOCKER_USERNAME }}/ngx-ramblers:latest

      - name: Push the Docker image to Docker Hub (latest)
        if: github.ref_name == 'main'
        run: docker push ${{ secrets.DOCKER_USERNAME }}/ngx-ramblers:latest

      - name: Tag the Docker image (github run number ${{ github.run_number }})
        run: docker tag ngx-ramblers:${{ github.run_number }} ${{ secrets.DOCKER_USERNAME }}/ngx-ramblers:${{ github.run_number }}

      - name: Push the Docker image to Docker Hub (github run number ${{ github.run_number }})
        run: docker push ${{ secrets.DOCKER_USERNAME }}/ngx-ramblers:${{ github.run_number }}

      - name: Build the worker Docker image (Serenity/JS base)
        if: github.event_name == 'push' && steps.worker-changes.outputs.worker == 'true'
        run: docker build . --build-arg CHROME_VERSION=${{ needs.resolve.outputs.chrome_version }} --file Dockerfile --target worker --tag ngx-ramblers-integration-worker:${{ github.run_number }}

      - name: Tag the worker Docker image (integration-worker-${{ github.run_number }})
        if: github.event_name == 'push' && steps.worker-changes.outputs.worker == 'true'
        run: docker tag ngx-ramblers-integration-worker:${{ github.run_number }} ${{ secrets.DOCKER_USERNAME }}/ngx-ramblers:integration-worker-${{ github.run_number }}

      - name: Push the worker Docker image to Docker Hub (integration-worker-${{ github.run_number }})
        if: github.event_name == 'push' && steps.worker-changes.outputs.worker == 'true'
        run: docker push ${{ secrets.DOCKER_USERNAME }}/ngx-ramblers:integration-worker-${{ github.run_number }}

      - name: Install Flyctl
        run: |
          curl -fsSL https://fly.io/install.sh | FLYCTL_INSTALL="$HOME/.fly" sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"

      - name: Verify Flyctl installation
        run: flyctl version

      - name: Deploy image ngx-ramblers:${{ github.run_number }} to fly.io
        timeout-minutes: 15
        env:
          ADMIN_MONGODB_URI: ${{ secrets.ADMIN_MONGODB_URI }}
          ENVIRONMENTS_ENCRYPTION_KEY: ${{ secrets.ENVIRONMENTS_ENCRYPTION_KEY }}
        run: |
          ts-node server/deploy/deploy-to-environments.ts --environment "${{ needs.resolve.outputs.auto_deploy_target }}" --image-tag "${{ github.run_number }}"

      - name: Deploy Ramblers upload worker
        if: github.event_name == 'push' && steps.worker-changes.outputs.worker == 'true'
        timeout-minutes: 15
        env:
          ADMIN_MONGODB_URI: ${{ secrets.ADMIN_MONGODB_URI }}
          ENVIRONMENTS_ENCRYPTION_KEY: ${{ secrets.ENVIRONMENTS_ENCRYPTION_KEY }}
          INTEGRATION_WORKER_IMAGE_REPOSITORY: ${{ secrets.DOCKER_USERNAME }}/ngx-ramblers
        run: |
          ts-node server/deploy/deploy-integration-worker.ts --image-tag "integration-worker-${{ github.run_number }}"

      - name: Advance worker-deployed ref after successful deploy
        if: github.event_name == 'push' && steps.worker-changes.outputs.worker == 'true'
        continue-on-error: true
        run: |
          for attempt in 1 2 3 4 5; do
            git push --force origin HEAD:refs/heads/worker-deployed && exit 0
            echo "worker-deployed push attempt $attempt failed, retrying"
            sleep $((attempt * 10))
          done
          exit 1


  release-notes:
    needs: deploy
    if: github.ref_name == 'main' && github.event_name == 'push' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: release-notes-main
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache root node_modules
        id: cache-release-notes-root-nm
        uses: actions/cache@v5
        with:
          path: node_modules
          key: root-nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install root dependencies
        if: steps.cache-release-notes-root-nm.outputs.cache-hit != 'true'
        run: npm ci --fetch-retries=5 --fetch-retry-factor=2 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000

      - name: Cache server node_modules
        id: cache-release-notes-server-nm
        uses: actions/cache@v5
        with:
          path: server/node_modules
          key: server-nm-${{ runner.os }}-${{ hashFiles('server/package-lock.json') }}

      - name: Install server dependencies
        if: steps.cache-release-notes-server-nm.outputs.cache-hit != 'true'
        run: npm ci --fetch-retries=5 --fetch-retry-factor=2 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000
        working-directory: ./server

      - name: Resolve unpublished commit range
        id: release-range
        run: |
          PUBLISHED_SHA=$(git ls-remote origin refs/heads/release-notes-published | awk '{print $1}')
          PUSH_BEFORE="${{ github.event.before }}"
          if [ -z "$PUBLISHED_SHA" ]; then
            if [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
              PUBLISHED_SHA="$PUSH_BEFORE"
              echo "No publication checkpoint; publishing only the commits in this push, after $PUBLISHED_SHA"
            else
              echo "This push has no previous commit, so there is nothing new to publish"
              echo "already-covered=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            git fetch origin refs/heads/release-notes-published:refs/remotes/origin/release-notes-published
            echo "The last completely published commit is $PUBLISHED_SHA"
          fi
          git cat-file -e "${PUBLISHED_SHA}^{commit}"
          if git merge-base --is-ancestor "$PUBLISHED_SHA" HEAD; then
            echo "already-covered=false" >> "$GITHUB_OUTPUT"
            echo "published-sha=$PUBLISHED_SHA" >> "$GITHUB_OUTPUT"
          elif git merge-base --is-ancestor HEAD "$PUBLISHED_SHA"; then
            echo "A newer queued run has already published this commit"
            echo "already-covered=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::The release-note checkpoint $PUBLISHED_SHA is not related to $GITHUB_SHA"
            exit 1
          fi

      - name: Publish every outstanding release note
        if: steps.release-range.outputs.already-covered == 'false'
        env:
          CMS_USERNAME: ${{ secrets.CMS_USERNAME }}
          CMS_PASSWORD: ${{ secrets.CMS_PASSWORD }}
        run: |
          cd server
          npm run release-notes -- --since "${{ steps.release-range.outputs.published-sha }}" --until "$GITHUB_SHA" --build-number "${{ github.run_number }}" --build-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" --include-unassigned

      - name: Record the completely published range
        if: steps.release-range.outputs.already-covered == 'false'
        run: git push origin HEAD:refs/heads/release-notes-published

  deploy-jitsi:
    needs: [ resolve, test ]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-jitsi-group
      cancel-in-progress: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache root node_modules
        id: cache-root-nm
        uses: actions/cache@v5
        with:
          path: node_modules
          key: root-nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install root dependencies
        if: steps.cache-root-nm.outputs.cache-hit != 'true'
        run: npm ci --fetch-retries=5 --fetch-retry-factor=2 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000

      - name: Cache server node_modules
        id: cache-server-nm
        uses: actions/cache@v5
        with:
          path: server/node_modules
          key: server-nm-${{ runner.os }}-${{ hashFiles('server/package-lock.json') }}

      - name: Install server dependencies
        if: steps.cache-server-nm.outputs.cache-hit != 'true'
        run: npm ci --fetch-retries=5 --fetch-retry-factor=2 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000
        working-directory: ./server

      - name: Detect jitsi-relevant changes
        id: jitsi-changes
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: ./server/node_modules/.bin/tsx server/deploy/detect-jitsi-changes.ts

      - name: Install ts-node
        if: steps.jitsi-changes.outputs.jitsi == 'true'
        run: npm install -g ts-node

      - name: Install Flyctl
        if: steps.jitsi-changes.outputs.jitsi == 'true'
        run: |
          curl -fsSL https://fly.io/install.sh | FLYCTL_INSTALL="$HOME/.fly" sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"

      - name: Verify Flyctl installation
        if: steps.jitsi-changes.outputs.jitsi == 'true'
        run: flyctl version

      - name: Deploy self-hosted Jitsi (only when image-affecting files changed)
        if: steps.jitsi-changes.outputs.jitsi == 'true'
        timeout-minutes: 15
        env:
          ADMIN_MONGODB_URI: ${{ secrets.ADMIN_MONGODB_URI }}
          ENVIRONMENTS_ENCRYPTION_KEY: ${{ secrets.ENVIRONMENTS_ENCRYPTION_KEY }}
        run: ts-node server/deploy/deploy-jitsi.ts

      - name: Advance jitsi-deployed ref after successful deploy
        if: steps.jitsi-changes.outputs.jitsi == 'true'
        run: git push --force origin HEAD:refs/heads/jitsi-deployed
