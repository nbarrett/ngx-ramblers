name: Deploy to Selected Environments

on:
  workflow_dispatch:
    inputs:
      environments:
        description: 'Select environments to deploy to (space-separated or "all")'
        required: true
        default: 'all'
        type: string
      image_tag:
        description: 'Docker image tag to deploy: latest, or a run number of the "Deploy and Build Docker Image and Deploy to Fly.io" workflow (NOT CodeQL or any other workflow)'
        required: true
        default: 'latest'
        type: string
      allow_old_image:
        description: 'Set true only for a deliberate rollback to an image older than the last 100 builds'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '24.14.0'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate-image-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Validate image_tag against the Docker build workflow
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ github.event.inputs.image_tag }}
          ALLOW_OLD_IMAGE: ${{ github.event.inputs.allow_old_image }}
        run: |
          BUILD_WORKFLOW="build-push-and-deploy-ngx-ramblers-docker-image.yml"
          if [ "$IMAGE_TAG" = "latest" ]; then
            echo "image_tag 'latest' always points at the newest successful build - OK"
            exit 0
          fi
          if ! echo "$IMAGE_TAG" | grep -qE '^[0-9]+$'; then
            echo "::error::image_tag '$IMAGE_TAG' must be 'latest' or a run number of the Docker build workflow"
            exit 1
          fi
          NUMBERS=$(gh api "/repos/${{ github.repository }}/actions/workflows/$BUILD_WORKFLOW/runs?status=success&per_page=100" --jq '.workflow_runs[].run_number')
          if [ -z "$NUMBERS" ]; then
            echo "::error::could not list successful runs of the Docker build workflow - refusing to deploy an unvalidated image_tag"
            exit 1
          fi
          LATEST=$(echo "$NUMBERS" | head -1)
          if echo "$NUMBERS" | grep -qx "$IMAGE_TAG"; then
            echo "image_tag $IMAGE_TAG is a successful Docker build run number (latest is $LATEST) - OK"
            exit 0
          fi
          if [ "$ALLOW_OLD_IMAGE" = "true" ]; then
            echo "::warning::image_tag $IMAGE_TAG is not among the last 100 successful Docker builds (latest is $LATEST) - deploying anyway because allow_old_image is set"
            exit 0
          fi
          echo "::error::image_tag $IMAGE_TAG is not among the last 100 successful runs of the Docker build workflow (latest is $LATEST). Run numbers from other workflows (CodeQL, deploys) are NOT image tags. Get the correct number with: gh run list --workflow=$BUILD_WORKFLOW --limit 1 --json number. For a deliberate rollback to an older image, re-run with allow_old_image=true."
          exit 1

  set-environments:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install root dependencies
        run: npm ci --fetch-retries=5 --fetch-retry-factor=2 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000

      - name: Install server dependencies
        run: npm ci --fetch-retries=5 --fetch-retry-factor=2 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000
        working-directory: ./server

      - name: Resolve environment matrix from database
        id: set-matrix
        env:
          ADMIN_MONGODB_URI: ${{ secrets.ADMIN_MONGODB_URI }}
        run: |
          if [ "${{ github.event.inputs.environments }}" = "all" ]; then
            MATRIX=$(./server/node_modules/.bin/tsx server/deploy/list-environment-names.ts 2>/dev/null | tail -n 1)
          else
            MATRIX='["'$(echo "${{ github.event.inputs.environments }}" | sed 's/ /","/g')'"]'
          fi
          echo "Matrix: $MATRIX"
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  deploy:
    needs: [set-environments, validate-image-tag]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        environment: ${{ fromJson(needs.set-environments.outputs.matrix) }}
    name: Deploy to ${{ matrix.environment }}
    environment: ${{ matrix.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install root dependencies
        run: npm ci --fetch-retries=5 --fetch-retry-factor=2 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000

      - name: Install server dependencies
        run: npm ci --fetch-retries=5 --fetch-retry-factor=2 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000
        working-directory: ./server

      - name: Install ts-node
        run: npm install -g ts-node

      - name: Log in to Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: echo "$DOCKER_PASSWORD" | docker login --username "$DOCKER_USERNAME" --password-stdin

      - name: Install Flyctl
        run: |
          curl -fsSL https://fly.io/install.sh | FLYCTL_INSTALL="$HOME/.fly" sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"

      - name: Verify Flyctl Installation
        run: |
          echo "Flyctl path: $(which flyctl)"
          flyctl version
          echo "FLYCTL_PATH=$(which flyctl)" >> $GITHUB_ENV

      - name: Deploy to ${{ matrix.environment }}
        env:
          ADMIN_MONGODB_URI: ${{ secrets.ADMIN_MONGODB_URI }}
        run: |
          ts-node server/deploy/deploy-to-environments.ts --environment "${{ matrix.environment }}" --image-tag "${{ github.event.inputs.image_tag }}"

